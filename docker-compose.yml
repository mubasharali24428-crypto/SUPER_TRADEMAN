# =============================================================================
# Algo Trading System — Infrastructure Services
# =============================================================================
#
# REQUIRED ENVIRONMENT VARIABLES (must be set in your shell or in a .env file
# that lives OUTSIDE this repository — real credentials are never committed):
#
#   POSTGRES_USER       Owner of the Postgres database (e.g. trading)
#   POSTGRES_PASSWORD   Postgres password (generate: openssl rand -base64 32)
#   POSTGRES_DB         Database name
#   REDIS_PASSWORD      Redis auth password (generate: openssl rand -base64 32)
#
# Compose uses ${VAR:?err} interpolation, so the stack REFUSES to start when a
# variable is unset — fail-closed by design. See .env.example for placeholder
# documentation only.
#
# SECURITY POSTURE:
#   * Service ports are bound to 127.0.0.1 ONLY — no LAN/host-network exposure.
#   * Redis requires auth (--requirepass).
#   * No default/hardcoded credentials exist anywhere in this file.
#
# To rotate a credential: update the external env file, then `docker compose up -d`.
# =============================================================================

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      # F-0001/F-0004: password comes from the environment; compose aborts if unset.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (real creds live outside the repo)}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    ports:
      # F-0014: localhost-only binding; never publish to 0.0.0.0.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7
    # F-0014/F-0004: require auth; fail closed if REDIS_PASSWORD is unset.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
