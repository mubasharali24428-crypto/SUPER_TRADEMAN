[project]
name = "trading"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.4",
    "asyncpg>=0.29",
    "redis>=5.0",
    "ccxt>=4.4",
    "arch>=6.0",
    "hmmlearn>=0.3",
    "copulas>=0.7",
    "scipy>=1.14",
    "networkx>=3.0",
    # Schema is owned by Alembic (alembic/versions/); the migration stack is a
    # runtime requirement, not an optional extra (HK-1). Versions matched to
    # .venv: alembic 1.19.1, sqlalchemy 2.0.52, greenlet 3.5.5.
    "alembic>=1.13,<2",
    "sqlalchemy[asyncio]>=2.0,<3",
    "greenlet>=3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # VC-030: `make coverage` runs pytest --cov; without this declared dep the
    # gate (fail_under = 60) is unenforceable on a fresh clone.
    "pytest-cov>=5",
    # Local mypy runs need redis stubs (pre-commit hook also declares them).
    "types-redis>=4.6",
]

[project.optional-dependencies]
# ALEX-FORCE SUB-05: authenticated FastAPI dashboard/API server (server.py).
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "itsdangerous>=2.2",
]
# OT-1: OPTIONAL distributed tracing. Nothing here is imported at module load
# time — trading.observability.otel lazy-imports the SDK and degrades to a
# no-op tracer when the group is not installed.
otel = [
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Tests import helpers from scripts/ at the repo root. The `pytest` console script
# does not put the rootdir on sys.path (unlike `python -m pytest`), so set it here
# to keep a bare `uv run pytest` working from a fresh clone.
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "fast: quick unit tests (default tier; no network, no heavy fitting)",
    "slow: long-running tests (full GARCH/EVT fits, large simulations)",
    "integration: cross-component tests (DB, docker-compose services)",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 60
show_missing = true

[tool.mypy]
# Batch-1 item: resolve the scripts/ dual-module-name error mypy raised
# ("Source file found twice under different module names"). With the src
# layout + root scripts/, mypy needs explicit package bases and a path that
# makes `trading.*` importable while scripts stay top-level modules.
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
# Runtime deps typed via stubs; keep the list in sync with [project].dependencies.
# types-redis is now a dev dependency for local runs; the pre-commit hook also
# declares it in additional_dependencies.
ignore_missing_imports = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading"]
