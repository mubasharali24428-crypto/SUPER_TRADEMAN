[project]
name = "trading"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.4",
    "asyncpg>=0.29",
    "redis>=5.0",
    "ccxt>=4.4",
    "arch>=6.0",
    "hmmlearn>=0.3",
    "copulas>=0.7",
    "scipy>=1.14",
    "networkx>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Tests import helpers from scripts/ at the repo root. The `pytest` console script
# does not put the rootdir on sys.path (unlike `python -m pytest`), so set it here
# to keep a bare `uv run pytest` working from a fresh clone.
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading"]
