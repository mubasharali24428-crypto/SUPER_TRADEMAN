version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: super_trademan_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.1.0
    container_name: super_trademan_grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: super_trademan_alertmanager
    ports:
      - "9093:9093"
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.0
    container_name: super_trademan_loki
    ports:
      - "3100:3100"
    restart: unless-stopped
