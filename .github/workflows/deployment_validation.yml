name: SUPER_TRADEMAN Deployment Validation Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov mypy flake8 black isort

      - name: 1. Code Formatting & Type Checks
        run: |
          black --check src/ scripts/ tests/
          isort --check-only src/ scripts/ tests/
          mypy src/ --ignore-missing-imports

      - name: 2. Run Full Pytest Suite with Coverage
        run: |
          PYTHONPATH=src:. python -m pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: 3. Deployment Preflight Check
        run: |
          PYTHONPATH=src:. python scripts/preflight_check.py --mode SHADOW

      - name: 4. Operational Kill-Switch Safety Drills
        run: |
          PYTHONPATH=src:. python scripts/kill_switch_drill.py --mode SHADOW

      - name: 5. Read-Only State Reconciliation Check
        run: |
          PYTHONPATH=src:. python scripts/reconcile_report.py --format json

      - name: 6. Shadow Mode Gate 1 Evaluation
        run: |
          PYTHONPATH=src:. python scripts/shadow_report.py --days 20 --format json

      - name: Upload Test & Coverage Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: test-coverage-report
          path: coverage.xml
